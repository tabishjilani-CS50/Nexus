{% extends 'base.html' %}{% block content %}<div class="card form"><h1>🎯 Savings Goal</h1><p>Turn a big goal into a monthly number.</p><form method="post"><label>Target</label><input type="number" step="0.01" name="target" required><label>Already saved</label><input type="number" step="0.01" name="current" value="0"><label>Months</label><input type="number" name="months" value="6" min="1"><button class="button">Calculate</button></form></div>{% if result %}<div class="card"><h2>Your plan</h2><p>Still needed: <b>{{result.left|money}}</b></p><p>Monthly target: <b>{{result.monthly|money}}</b></p></div>{% endif %}{% endblock %}
