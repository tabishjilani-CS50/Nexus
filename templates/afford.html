{% extends 'base.html' %}{% block content %}<div class="card form"><h1>💸 Can I Afford This?</h1><p>Current balance: <b>{{balance|money}}</b></p><form method="post"><label>Purchase price</label><input type="number" step="0.01" name="price" required><label>Important savings goal (optional)</label><input type="number" step="0.01" name="goal" value="0"><button class="button">Check It</button></form></div>{% if result %}<div class="card"><h2>{{result.status}}</h2><p>{{result.message}}</p><p>Balance after: <b>{{result.after|money}}</b></p></div>{% endif %}{% endblock %}
