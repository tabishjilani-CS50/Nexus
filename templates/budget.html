{% extends 'base.html' %}{% block content %}<div class="grid two"><div class="card"><h1>Budgets</h1><form method="post"><input name="category" placeholder="Category" required><input name="amount" type="number" placeholder="Limit" required><button>Save budget</button></form></div><div class="card"><h2>Current budgets</h2>{% for r in rows %}<div class="row"><span>{{r.category}}</span><span>{{r.spent|money}} / {{r.limit|money}}</span></div><div class="bar"><i style="width:{{r.percent}}%"></i></div>{% else %}<p>No budgets yet.</p>{% endfor %}</div></div>{% endblock %}
