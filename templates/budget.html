{% extends 'base.html' %}{% block content %}<div class="grid two"><div class="card form"><h1>Budget</h1><form method="post"><label>Category</label><input name="category" placeholder="Food"><label>Limit</label><input type="number" step="0.01" name="amount"><button class="button">Save Budget</button></form></div><div class="card"><h2>Your budgets</h2>{% for b in budgets %}<div class="row"><b>{{b.category}}</b><span>{{b.spent|money}} / {{b.limit|money}}</span><small>{{b.percent}}%</small></div>{% else %}<p>No budgets yet.</p>{% endfor %}</div></div>{% endblock %}
