{% extends 'base.html' %}{% block content %}<div class="card form"><h1>🛡 Emergency Buffer</h1><p>Roughly check how long your money could cover essential costs.</p><form method="post"><label>Money available</label><input type="number" step="0.01" name="available" required><label>Essential monthly costs</label><input type="number" step="0.01" name="essential" required><button class="button">Check Buffer</button></form></div>{% if result %}<div class="card"><div class="big">{{result.months}} months</div><p>{{result.message}}</p></div>{% endif %}{% endblock %}
