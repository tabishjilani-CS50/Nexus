{% extends 'base.html' %}{% block content %}<div class="card form"><h1>Add Transaction</h1><p>Keep it simple.</p><form method="post"><label>Date</label><input type="date" name="date"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select><label>Category</label><input name="category" placeholder="Food, Transport, Education"><label>Amount</label><input type="number" step="0.01" name="amount" required><label>Description</label><input name="description" placeholder="What was it for?"><button class="button">Save</button></form></div>{% endblock %}
