{% extends 'base.html' %}{% block content %}<div class="card"><h1>Transactions</h1><form class="search"><input name="search" placeholder="Search..."><button class="button">Search</button></form></div><div class="card">{% for t in transactions %}<div class="transaction"><div><b>{{t.category}}</b><small>{{t.date}} • {{t.description}}</small></div><div><b class="{{t.type}}">{% if t.type=='income' %}+{% else %}-{% endif %}{{t.amount|money}}</b><a class="delete" href="/delete/{{t.id}}">delete</a></div></div>{% else %}<p>No transactions found.</p>{% endfor %}</div>{% endblock %}
